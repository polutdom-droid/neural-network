    <script>
      // Safeguard against browser extensions attempting to overwrite read-only window.fetch in iframe environments
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var patchTarget = function (target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (newFetch) {
                  if (typeof newFetch === 'function') {
                    currentFetch = newFetch;
                  }
                }
              });
            } catch (_) {}
          };
          patchTarget( window );
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchTarget(Window.prototype);
          }
        } catch (e) {
          // Ignore if non-configurable
        }

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reasonStr = event && event.reason ? String(event.reason.stack || event.reason.message || event.reason) : '';
            if (
              reasonStr.indexOf('chrome-extension://') !== -1 ||
              reasonStr.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
